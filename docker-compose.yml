# Ротация логов (S7-19): без лимита json-file на Docker Desktop растёт неограниченно. 3x10 МБ на сервис.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  unbound:
    # Собственный рекурсивный резолвер: Spamhaus/SURBL блокируют публичные резолверы
    # (8.8.8.8/1.1.1.1) как shared/anonymous — см. docs/api/blacklist.md. Статический IP
    # в сети combine, т.к. dnspython (DNS_RESOLVER) принимает только IP-литерал, не имя
    # сервиса. Без ports: — нужен только внутри docker-сети, наружу не торчит.
    # TODO(S7-19): тег :latest не зафиксирован. Подобрать конкретный тег/дайджест нужно на боксе
    # (`docker image inspect mvance/unbound:latest --format "{{index .RepoDigests 0}}"`), вслепую не пинуем.
    image: mvance/unbound:latest
    restart: unless-stopped
    logging: *logging
    networks:
      combine:
        ipv4_address: 172.28.0.53

  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"                      # localhost-only; reach from Mac via SSH tunnel
    healthcheck:                                   # gate backend/worker until PG accepts connections
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - combine

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    # /health открыт даже под Basic-auth. healthy = миграции накатились (alembic идёт в command ДО
    # uvicorn) и панель отвечает — на это ждёт worker, чтобы не гоняться с миграцией (S7-19).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - combine
    ports:
      # EXPOSED ON LAN (trusted home network). The panel/pipeline have NO auth, so this is
      # safe ONLY behind the home router's NAT — never port-forward :8000 to the internet.
      # Bound to the box's LAN IP (not 0.0.0.0) so a stray VPN/2nd interface can't expose it.
      # SECURITY NOTE: без auth любой в LAN может гонять пайплайн, включая POST /admin/pull
      #   (git-pull + reload). Закрой Basic-auth: задай PANEL_USER+PANEL_PASS в .env (см.
      #   app/main.py) — тогда LAN-экспозиция безопасна. Или ограничь source-IP в DOCKER-USER.
      # NB: Docker publishes via the FORWARD/DOCKER chain, bypassing a host ufw INPUT drop.
      # Want it private again? revert to "127.0.0.1:8000:8000" and use an SSH tunnel (docs/DEPLOY.md).
      # If the box IP changes via DHCP this fails to bind — reserve 192.168.1.77 on the router.
      - "192.168.1.77:8000:8000"
    volumes:
      - ./backend:/app
      # весь репо (с .git) → /repo, чтобы кнопка «Обновить из git» в панели делала
      # git pull прямо в смонтированные файлы (./backend == /app подхватит --reload).
      - .:/repo
    # auto-migrate on start (alembic upgrade head is idempotent), then serve.
    # --reload ОСТАВЛЕН сознательно (F8-16): оператор обновляет бокс кнопкой git-pull без консоли, а
    # без reload код панели не подхватится до ручного рестарта. Убийство идущих задач при pull
    # закрыто иначе — services/deploy.py отказывает в pull/force-pull, пока в job_run есть живая
    # задача (score/discovery/sweep/...). Остаточный риск: ручная правка *.py на боксе посреди задачи.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      backend:                                     # миграции делает ТОЛЬКО backend; worker стартует после них
        condition: service_healthy
    # живость = свежее сердцебиение воркера в job_run (app/services/heartbeat.py, бьёт раз в минуту).
    # unhealthy виден в `docker compose ps` и на /diag; сам по себе compose его не перезапускает.
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.heartbeat"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - combine
    volumes:
      - ./backend:/app
    # watchfiles (в образе через uvicorn[standard]) перезапускает шедулер при правке *.py в /app —
    # код воркера подхватывается после git-pull живьём, без пересборки/рестарта контейнера.
    command: watchfiles 'python -m app.workers.scheduler' /app

  backup:
    # Ежедневный pg_dump в ./backups на хосте (D:\combine_machine\backups на боксе), хранятся 14 последних.
    # Первый дамп — сразу при старте сервиса. Откат v2 -> v1 и любой откат миграции возможны ТОЛЬКО из дампа
    # (docs/DEPLOY.md, «Бэкап и откат»). Ручной дамп перед обновлением:
    #   docker compose run --rm backup sh -c 'pg_dump -h db -U portfolio portfolio | gzip > /backups/manual.sql.gz'
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: portfolio
    volumes:
      - ./backups:/backups
    networks:
      - combine
    command: >
      sh -c 'while true; do
        f=/backups/portfolio-$$(date -u +%Y%m%d-%H%M%S).sql.gz;
        if pg_dump -h db -U portfolio portfolio | gzip > "$$f"; then echo "[backup] $$f"; else echo "[backup] FAILED"; rm -f "$$f"; fi;
        ls -1t /backups/portfolio-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f;
        sleep 86400; done'

  aapanel-tunnel:
    # SSH-туннель бокс -> VPS: aaPanel видит запросы с 127.0.0.1 и whitelist по публичному IP бокса не
    # нужен. ОПЦИОНАЛЕН (профиль tunnel): `docker compose --profile tunnel up -d --build aapanel-tunnel`;
    # backend/worker от него НЕ зависят. В .env: AAPANEL_TUNNEL=1, AAPANEL_URL=https://aapanel-tunnel:18839,
    # AAPANEL_CA_BUNDLE. Порт наружу НЕ публикуется — слушает только сеть combine.
    # Ключ и known_hosts — ./secrets/tunnel/ (gitignored), монтируются read-only. Нет ключа — контейнер
    # выходит с кодом 78 и причиной в логах (не стартует тихо). Runbook: docs/v2/aapanel-tunnel-runbook.md
    profiles: ["tunnel"]
    build: ./tunnel
    # unless-stopped (как у остальных): после ребута бокса сеть/VPS могут быть недоступны, туннель обязан
    # переподключаться бесконечно, а не сдаваться после 5 рестартов. Код 78 (нет ключа) виден как restarting.
    restart: unless-stopped
    logging: *logging
    environment:
      TUNNEL_VPS_HOST: ${TUNNEL_VPS_HOST:-}
      TUNNEL_VPS_USER: ${TUNNEL_VPS_USER:-tunnel}
      TUNNEL_VPS_SSH_PORT: ${TUNNEL_VPS_SSH_PORT:-22}
      TUNNEL_PORT: ${TUNNEL_PORT:-18839}
    volumes:
      - ./secrets/tunnel:/ssh-src:ro
    # слушатель появляется только ПОСЛЕ успешной SSH-авторизации -> healthy = туннель реально поднят
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $${TUNNEL_PORT:-18839}"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - combine

networks:
  combine:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
