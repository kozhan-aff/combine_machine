нным ваших банковских карт.\"},\"user_rights\":{\"title\":\"6. Ваши права\",\"description\":\"Поскольку мы не храним персональные данные, позволяющие идентифицировать вашу личность в сети, право на \\\"удаление истории\\\" реализуется автоматически — история просто не записывается. Вы можете удалить свой аккаунт в любое время, обратившись на support@durevpn.com.\"}},\"terms_and_conditions\":{\"1\":\"1. ОПРЕДЕЛЕНИЕ ТЕРМИНОВ\",\"2\":\"2. ОБЩИЕ ПОЛОЖЕНИЯ\",\"3\":\"3. ЦЕНА УСЛУГ\",\"4\":\"4. ОФОРМЛЕНИЕ ЗАКАЗА\",\"5\":\"5. ПОРЯДОК ОКАЗАНИЯ УСЛУГ\",\"6\":\"6. ПРЕКРАЩЕНИЕ ОКАЗАНИЯ УСЛУГ\",\"7\":\"7. ОТВЕТСТВЕННОСТЬ СТОРОН\",\"8\":\"8. ОСОБЕННОСТИ ИСПОЛЬЗОВАНИЯ ОТДЕЛЬНЫХ СЕРВЕРНЫХ НАПРАВЛЕНИЙ\",\"9\":\"9. ИНФОРМАЦИОННЫЕ И РЕКЛАМНЫЕ РАССЫЛКИ\",\"10\":\"10. ИЗМЕНЕНИЕ УСЛОВИЙ ОФЕРТЫ\",\"title\":\"ДОГОВОР ОФЕРТЫ\",\"description\":\"Данная Оферта от владельца интернет-сайтов \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e, в дальнейшем «Продавец», в адрес пользователя услуг интернет-сайта, в дальнейшем «Покупатель», является предложением заключить Договор оказания Услуг и определяет основные условия оказания Услуг через интернет-сайты \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e.\",\"description_acceptance\":\"Покупатель, действуя с целью приобретения Услуг, принимает условия настоящего Договора оказания услуг (далее — Договор) на следующих условиях.\",\"1_1\":\"1.1. \u003cstrong\u003eПубличная оферта\u003c/strong\u003e (далее — Оферта) — публичное предложение Продавца, адресованное неопределенному кругу лиц, заключить с Продавцом Договор оказания услуг дистанционным способом (далее — Договор) на условиях, содержащихся в настоящей Оферте, включая все Приложения.\",\"1_2\":\"1.2. \u003cstrong\u003eЗаказ\u003c/strong\u003e — решение Покупателя заказать Услуги обработки данных через интернет-сайты \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e посредством выбора одного из Тарифов и его оплаты, являющееся полным и безоговорочным акцептом Покупателем настоящей Оферты.\",\"1_3\":\"1.3. \u003cstrong\u003eПродавец\u003c/strong\u003e предоставляет Услуги обработки данных, включая услуги частного виртуального доступа, а также иные Услуги, относящиеся к частной безопасности в сети Интернет и частному доступу к сети Интернет (далее — Услуги). Услуги включают, но не ограничиваются VPN и прочим программным обеспечением, дополнениями, приложениями, информацией и информационными материалами, доступными Покупателю от Продавца.\",\"1_4\":\"1.4. \u003cstrong\u003eТариф\u003c/strong\u003e — совокупность условий предоставления Услуг, включая стоимость, срок подписки, доступные категории серверов, квоты трафика и максимальное количество одновременно подключенных устройств. Актуальные условия и стоимость Тарифов размещаются на интернет-сайтах \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e и в интерфейсах Сервиса.\",\"1_5\":\"1.5. \u003cstrong\u003eПериод учета квот трафика\u003c/strong\u003e — календарный месяц. Квоты трафика обновляются 1-го числа каждого календарного месяца независимо от даты начала подписки, срока подписки и даты ее оплаты или продления. При активации подписки первый период учета квот трафика длится с момента активации подписки до начала следующего календарного месяца.\",\"2_1\":\"2.1. Покупатель осуществляет Заказ Услуг обработки данных через интернет-сайты \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e посредством выбора одного из представленных Тарифов. Оплатой Заказа Покупатель подтверждает согласие на заключение настоящего Договора (акцепт Оферты).\",\"2_2\":\"2.2. Заключая Договор, Покупатель подтверждает следующее:\",\"2_2_a\":\"а) Покупатель целиком и полностью ознакомлен и согласен с условиями настоящего Договора;\",\"2_2_b\":\"б) Покупатель дает разрешение на сбор, обработку и передачу персональных данных на условиях, определенных в Политике обработки персональных данных, размещенной на интернет-сайтах \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e.\",\"3_1\":\"3.1. Цена на Услуги обработки данных указана на интернет-сайтах \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e в разделе Тарифов.\",\"3_2\":\"3.2. Продавец вправе в одностороннем порядке изменять цену на любой Тариф. Изменение цены применяется к новым Заказам и не влияет на размер периодического списания по ранее оформленной подписке с автоматическим продлением в случаях, предусмотренных п. 4.9–4.10 настоящей Оферты.\",\"3_3\":\"3.3. Изменение Продавцом цены на оплаченный Заказ не допускается.\",\"3_4\":\"3.4. Обязательства Покупателя по оплате Заказа считаются исполненными с момента поступления Продавцу денежных средств в соответствии с Тарифами в полном размере.\",\"3_5\":\"3.5. Расчеты между Продавцом и Покупателем за Услуги производятся способами, указанными на сайтах \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e.\",\"4_1\":\"4.1. Заказ Услуг осуществляется Покупателем через сайты \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e либо путем выставления счета на оплату на e-mail клиента.\",\"4_2\":\"4.2. При Заказе на интернет-сайтах \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e Покупатель обязуется предоставить адрес электронной почты.\",\"4_3\":\"4.3. Если Продавцу необходима дополнительная информация, он вправе запросить ее у Покупателя. В случае непредоставления необходимой информации Покупателем Продавец не несет ответственности за предоставление качественной услуги Покупателю.\",\"4_4\":\"4.4. Покупатель несет ответственность за достоверность предоставленной информации при оформлении и оплате Заказа.\",\"4_5\":\"4.5. Договор между Продавцом и Покупателем считается заключенным с момента электронного оформления Заказа на интернет-сайтах \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e и его оплаты Покупателем.\",\"4_6\":\"4.6. При выборе способа оплаты, для которого предусмотрено автоматическое продление, подписка оформляется с автоматическим продлением. Совершая оплату таким способом, Покупатель соглашается на последующие периодические списания в соответствии с условиями настоящей Оферты.\",\"4_6_methods\":\"Перечень способов оплаты, для которых предусмотрено автоматическое продление, отображается Покупателю при оформлении Заказа.\",\"4_6_1\":\"4.6.1. При оплате способом, требующим предварительного согласия Покупателя на периодические переводы в приложении его банка, такое согласие предоставляется до совершения первого платежа и является обязательным условием оформления подписки с автоматическим продлением.\",\"4_6_1_withdrawal\":\"Покупатель вправе отозвать указанное согласие в приложении своего банка. Отзыв согласия прекращает последующие периодические списания и влечет последствия, предусмотренные п. 4.11 настоящей Оферты.\",\"4_7\":\"4.7. Периодическое списание производится автоматически по окончании каждого оплаченного периода без дополнительного подтверждения со стороны Покупателя перед каждым списанием. Периодичность списаний соответствует выбранному при оформлении сроку подписки. Доступные сроки подписки зависят от выбранного способа оплаты и отображаются Покупателю при оформлении Заказа.\",\"4_8\":\"4.8. Подписки сроком на 2 года, а также пробный период продолжительностью 1 день оплачиваются разово и не предусматривают автоматического продления.\",\"4_9\":\"4.9. Размер периодического списания определяется исходя из стоимости выбранного срока подписки с учётом скидки, установленной для такого срока на момент оформления, и фиксируется в момент подключения автоматического продления.\",\"4_9_promos\":\"Промокоды и иные индивидуальные скидки, применённые при первоначальной оплате, уменьшают только сумму первого платежа и не применяются к последующим периодическим списаниям.\",\"4_9_currency\":\"Расчётная валюта периодических списаний определяется выбранным способом оплаты. Для способов оплаты в рублях Российской Федерации расчётной валютой является рубль, и размер периодического списания не зависит от валютных курсов. Для зарубежных способов оплаты расчётной валютой являются доллары США (USD): при оплате картой или счётом в иной валюте фактически списанная сумма может отличаться от суммы первоначального платежа вследствие изменения валютного курса и условий конвертации банка или платёжного провайдера Покупателя.\",\"4_10\":\"4.10. Последующее изменение стоимости соответствующего Тарифа в каталоге Продавца не изменяет размер периодического списания по уже оформленной подписке с автоматическим продлением.\",\"4_11\":\"4.11. Покупатель вправе в любое время отключить автоматическое продление в Telegram-боте в настройках профиля либо в личном кабинете на сайте Продавца.\",\"4_11_access\":\"Отключение автоматического продления не прекращает текущий оплаченный период: доступ к Услугам сохраняется до его окончания, а следующее автоматическое списание отменяется.\",\"4_11_refund\":\"Само по себе отключение автоматического продления не является основанием для возврата денежных средств за уже оплаченный период. Условия возврата определяются действующей Политикой возврата средств и отмены подписки Продавца.\",\"4_12\":\"4.12. После отключения автоматическое продление не возобновляется автоматически. Для повторного подключения автоматического продления Покупателю необходимо заново оформить оплату способом, предусматривающим автоматическое продление.\",\"4_13\":\"4.13. Изменение срока действующей подписки с автоматическим продлением осуществляется в порядке, предусмотренном интерфейсами Сервиса. Условия такого изменения, включая судьбу ранее подключенного автоматического продления, отображаются Покупателю до подтверждения операции.\",\"4_13_failure\":\"Если оплата нового срока не состоялась, ранее подключенное автоматическое продление сохраняется в неизменном виде.\",\"4_14\":\"4.14. Если очередное периодическое списание не было успешно выполнено, платёжным провайдером могут осуществляться повторные попытки списания. Если списание не было успешно завершено, новый период подписки не активируется, а доступ к Услугам сохраняется только до окончания ранее оплаченного периода.\",\"5_1\":\"5.1. Оказание Услуг осуществляется в порядке, описанном на интернет-сайтах \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e.\",\"6_1\":\"6.1. Покупатель вправе отказаться от Услуг в любое время действия Договора, средства, уплаченные в соответствии с Тарифами, возврату не подлежат. Ознакомиться с полной Политикой возвратов можно по \u003cc\u003eсоответствующей ссылке\u003c/c\u003e на сайте Продавца.\",\"6_2\":\"6.2. Если Покупатель не обратился к Продавцу в письменном виде по адресам, указанным на интернет-сайтах \u003ca\u003ehttps://durevpn.com/\u003c/a\u003e, \u003cb\u003ehttps://durev.cloud/\u003c/b\u003e, с предложением о прекращении Договора, Договор признается действующим до его прекращения по соглашению Сторон.\",\"6_3\":\"6.3. Продавец вправе ограничить Покупателю предоставление Услуг в случае выявления фактов недобросовестного использования Сервиса, а именно:\",\"6_3_a\":\"а) использование Сервиса Покупателем в целях нарушения законодательства Российской Федерации или других государств;\",\"6_3_b\":\"б) передача индивидуального ключа доступа третьим лицам, за исключением близких родственников Покупателя.\",\"6_3_quota\":\"Исчерпание предусмотренной Тарифом квоты трафика не является недобросовестным использованием Сервиса и регулируется положениями раздела 8 настоящей Оферты.\",\"7_1\":\"7.1. Покупатель обязуется не использовать систему для рассылки спама, сканирования портов и прокси, осуществления массовой рассылки, даже если письма фактически отправляются через другой сервер, не совершать хакерских атак на другие компьютеры или сети.\",\"7_2\":\"7.2. Зона покрытия, скорость интернета и качество связи при оказании Услуг могут варьироваться. Продавец обязуется сделать все возможное для того, чтобы Услуги оказывались в любое время, за исключением перерывов на техобслуживание и ремонт. Услуги могут быть недоступны вследствие возникновения не зависящих от Продавца факторов, включая чрезвычайные ситуации, сетевые проблемы или ограничения, помехи, прерывание сигнала, нарушения в работе других служб.\",\"7_3\":\"7.3. Продавец не несет ответственности за потерю данных и сообщений, неправильное отражение страниц вследствие проблем с сетью. Для защиты Покупателей Продавец в одностороннем порядке может устанавливать ограничения на использование определенных данных и блокировать обслуживание клиентов. Скорость сети — это номинальная оценочная характеристика, и она не соответствует реальной скорости отправки и приема данных. Фактическая скорость сети зависит от ее конфигурации, способа сжатия данных, нагрузки на сеть и иных факторов. Продавец не дает гарантий, касающихся своевременности получения данных, и не несет ответственности за возможные задержки или потери.\",\"contact2\":{\"name\":\"ТОО «CIT» («СИТ»)\",\"address\":\"Республика Казахстан, г. Алматы, Ауэзовский район, проспект Райымбек, дом 496а, индекс 050031\",\"bin\":\"220440014920\",\"email\":\"auth@durevpn.com\"},\"8_1\":\"8.1. Покупателю предоставляется доступ к серверным направлениям Сервиса в объеме и на условиях выбранного Тарифа.\",\"8_2\":\"8.2. В Сервисе используются следующие категории трафика:\",\"8_2_common\":\"\u003cstrong\u003eОбщий\u003c/strong\u003e;\",\"8_2_whitelist\":\"\u003cstrong\u003eБелые списки\u003c/strong\u003e;\",\"8_2_gaming\":\"\u003cstrong\u003eAI\u003c/strong\u003e.\",\"8_2_composition\":\"Конкретный состав серверов и серверных направлений внутри каждой категории определяется Продавцом и может быть изменен Продавцом в любое время по своему усмотрению без необходимости внесения изменений в настоящую Оферту.\",\"8_2_current\":\"Актуальный состав серверов и серверных направлений отображается в интерфейсах Сервиса.\",\"8_3\":\"8.3. Для Тарифов устанавливаются указанные в таблице ниже квоты трафика на каждый период учета квот трафика и максимальное количество одновременно подключенных устройств. При активации подписки и при каждом последующем обновлении квот Покупателю предоставляется полный объем трафика, предусмотренный действующим Тарифом для каждой категории. Обновление квот осуществляется при условии действующей подписки. Неиспользованный остаток основной квоты на следующий период не переносится. Правила сохранения дополнительного трафика определяются п. 8.8 настоящей Оферты.\",\"8_table_tariff\":\"Тариф\",\"8_table_common\":\"Общий\",\"8_table_whitelist\":\"Белые списки\",\"8_table_gaming\":\"AI\",\"8_table_devices\":\"Одновременно подключенных устройств\",\"8_table_light_tariff\":\"Лайт (Light)\",\"8_table_light_common\":\"250 ГБ\",\"8_table_light_whitelist\":\"40 ГБ\",\"8_table_light_gaming\":\"не предоставляется\",\"8_table_light_devices\":\"до 5\",\"8_table_standard_tariff\":\"Стандарт (Standard)\",\"8_table_standard_common\":\"650 ГБ\",\"8_table_standard_whitelist\":\"75 ГБ\",\"8_table_standard_gaming\":\"75 ГБ\",\"8_table_standard_devices\":\"до 15\",\"8_table_ultra_tariff\":\"Ультра (Ultra)\",\"8_table_ultra_common\":\"3 000 ГБ\",\"8_table_ultra_whitelist\":\"150 ГБ\",\"8_table_ultra_gaming\":\"150 ГБ\",\"8_table_ultra_devices\":\"до 30\",\"8_4\":\"8.4. Продавец вправе в одностороннем порядке в любое время по своему усмотрению изменять размеры квот трафика, максимальное количество одновременно подключенных устройств, доступность отдельных категорий серверов и иные технические параметры Тарифов.\",\"8_4_actual\":\"Актуальные параметры Тарифов размещаются на интернет-сайтах Продавца и/или в интерфейсах Сервиса.\",\"8_4_effective\":\"Изменения вступают в силу с момента их публикации, если Продавцом не указан иной срок.\",\"8_5\":\"8.5. Квоты трафика учитываются отдельно по каждой категории.\",\"8_5_devices\":\"Максимальное количество устройств означает количество устройств, которые могут одновременно использовать Сервис в рамках одной подписки.\",\"8_6\":\"8.6. При исчерпании установленной квоты по определенной категории доступ к серверам соответствующей категории блокируется до ближайшего обновления квот 1-го числа следующего календарного месяца либо до появления дополнительного доступного объема трафика по соответствующей категории, если возможность его приобретения предусмотрена Тарифом. Восстановление доступа возможно при условии действующей подписки.\",\"8_6_subscription\":\"Исчерпание квоты одной категории не прекращает действие подписки и не ограничивает доступ к другим категориям, по которым квота трафика не исчерпана.\",\"8_6_blocking\":\"При достижении квоты скорость соответствующей категории не снижается — доступ к ней блокируется.\",\"8_7\":\"8.7. Дополнительный объем трафика может быть приобретен исключительно в рамках Тарифа \u003cstrong\u003eУльтра\u003c/strong\u003e на условиях, действующих на момент приобретения.\",\"8_7_unavailable\":\"На Тарифах \u003cstrong\u003eЛайт\u003c/strong\u003e и \u003cstrong\u003eСтандарт\u003c/strong\u003e приобретение дополнительного трафика не предусмотрено.\",\"8_8\":\"8.8. Дополнительный трафик приобретается Покупателем отдельно для выбранной категории трафика и учитывается в рамках соответствующей категории.\",\"8_8_terms\":\"Тип, доступный объем и стоимость дополнительного трафика отображаются Покупателю до момента его приобретения.\",\"8_8_carry\":\"Неиспользованный дополнительный трафик не сгорает по окончании периода учета квот трафика и переносится на последующие периоды.\",\"8_9\":\"8.9. Использование протоколов пиринговых сетей (torrent, BitTorrent и иных аналогичных технологий обмена данными по принципу «точка-точка»), далее — «торрент-трафик», допускается Покупателем исключительно на серверных направлениях, специально предназначенных для такого трафика и отмеченных тегом «Торренты» в интерфейсе приложения Сервиса.\",\"8_10\":\"8.10. На всех иных серверных направлениях, не отмеченных тегом «Торренты», использование торрент-трафика ограничено. Продавец вправе ограничивать скорость («применять шейпинг»), приостанавливать либо блокировать торрент-трафик на любых серверных направлениях, не отмеченных тегом «Торренты», в том числе без предварительного уведомления Покупателя.\",\"8_10_independent\":\"Данное ограничение применяется независимо от наличия доступного объема трафика по соответствующей категории.\",\"8_11\":\"8.11. При использовании автоматического режима выбора серверного направления («Auto») пропуск торрент-трафика обеспечивается только в случае, если выбранное направление отмечено тегом «Торренты». В остальных случаях применяются ограничения, предусмотренные п. 8.10 настоящей Оферты.\",\"8_12\":\"8.12. Покупатель самостоятельно несет ответственность за законность передаваемых данных. Использование серверных направлений с тегом «Торренты» не освобождает Покупателя от обязанностей, предусмотренных п. 7.1 настоящей Оферты, и не допускается для распространения материалов, нарушающих права третьих лиц или применимое законодательство.\",\"8_13\":\"8.13. В течение действующей подписки Покупателю доступно изменение Тарифа только в сторону повышения:\",\"8_13_order\":\"Лайт → Стандарт → Ультра.\",\"8_13_downgrade\":\"Понижение Тарифа в течение действующей подписки не допускается.\",\"8_13_after\":\"После окончания срока действующей подписки Покупатель вправе приобрести любой доступный Тариф.\",\"8_14\":\"8.14. Повышение Тарифа может осуществляться путем обмена оставшихся дней подписки.\",\"8_14_recalculation\":\"При таком способе оставшееся количество дней текущего Тарифа пересчитывается в количество дней нового Тарифа с применением коэффициента обмена, действующего на момент операции.\",\"8_14_result\":\"В результате пересчета количество оставшихся дней подписки уменьшается.\",\"8_14_irreversible\":\"Обмен дней осуществляется без дополнительной оплаты и является необратимым.\",\"8_15\":\"8.15. Повышение Тарифа также может осуществляться путем перехода с доплатой.\",\"8_15_payment\":\"В таком случае оставшийся срок подписки сохраняется полностью, а Покупатель оплачивает сумму перехода, рассчитанную по коэффициенту доплаты, действующему на момент операции.\",\"8_16\":\"8.16. Актуальные коэффициенты обмена дней и доплаты, а также итоговый результат расчета отображаются Покупателю до подтверждения смены Тарифа.\",\"8_16_confirmation\":\"Подтверждая операцию, Покупатель соглашается с отображенным количеством дней нового Тарифа либо размером доплаты.\",\"8_17\":\"8.17. Ранее приобретенный дополнительный трафик сохраняется при смене Тарифа и продолжает учитываться в рамках соответствующей категории трафика.\",\"9_1\":\"9.1. Оформляя Заказ и предоставляя адрес электронной почты либо иные контактные данные, Покупатель соглашается на получение от Продавца сервисных уведомлений, а также информационных и рекламных сообщений, связанных с оказанием Услуг.\",\"9_2\":\"9.2. Покупатель вправе в любое время отказаться от получения информационных и рекламных рассылок, обратившись в службу поддержки Продавца по любому из доступных каналов связи, в том числе через бот технической поддержки в мессенджере Telegram (\u003cd\u003ehttps://t.me/DurevVpnSupportBot\u003c/d\u003e) либо через веб-панель поддержки (\u003ce\u003ehttps://support.durev.support/\u003c/e\u003e). Отказ обрабатывается Продавцом в разумный срок с момента получения обращения.\",\"9_3\":\"9.3. Отказ от информационных и рекламных рассылок не влияет на получение Покупателем сервисных уведомлений, необходимых для оказания Услуг, в том числе сообщений об изменении условий Договора, состоянии подписки, технических работах и вопросах безопасности.\",\"10_1\":\"10.1. Продавец вправе в любое время в одностороннем порядке по своему усмотрению изменять, дополнять или исключать положения настоящей Оферты, если иное не предусмотрено применимым законодательством.\",\"10_2\":\"10.2. Актуальная редакция Оферты размещается на интернет-сайтах Продавца.\",\"10_3\":\"10.3. Новая редакция Оферты вступает в силу с момента ее публикации, если иной срок вступления в силу прямо не указан при публикации.\",\"10_4\":\"10.4. Публикация новой редакции Оферты на интернет-сайтах Продавца является уведомлением Покупателя об изменении условий Договора.\",\"10_5\":\"10.5. Информация о существенных изменениях условий оказания Услуг может дополнительно направляться Покупателю в виде сервисного уведомления в порядке, предусмотренном п. 9.3 настоящей Оферты.\"},\"login\":{\"header\":\"вход.exe\",\"placeholder\":\"example@gmail.com\",\"success\":\"отлично, проверь свою почту\",\"title\":\"Отправим тебе ссылку для входа в кабинет на почту\",\"cta\":{\"login\":\"войти по email\",\"signup\":\"зарегистрироваться по email\",\"apply\":\"применить\",\"save\":\"сохранить\",\"get_code\":\"получить код\",\"go_to_login\":\"перейти ко входу\",\"get_magic_link\":\"получить ссылку для входа\",\"sending\":\"отправляем...\",\"confirm\":\"подтвердить\",\"log_in_with_password\":\"войти по паролю\",\"checking\":\"проверяем...\",\"try_again\":\"попробовать снова\",\"continue_with_email\":\"продолжить по email\"},\"time_in_seconds\":\"Ты запрашиваешь код слишком часто. Попробуй через {time}\",\"too_many_login_attempts\":\"Слишком много попыток входа. Попробуй через {time}\",\"email_errors\":{\"email_undeliverable\":{\"with_support\":\"Похоже, письма на этот адрес не доходят — проверь, нет ли опечатки. Если адрес верный и почта на него приходит, напиши нам с него на {support_email}, и мы снимем ограничение.\",\"without_support\":\"Похоже, письма на этот адрес не доходят — проверь, нет ли опечатки. Если адрес верный и почта на него приходит, обратись в поддержку с этого адреса.\"},\"disposable_email\":\"Одноразовая почта не подходит для регистрации — укажи адрес, к которому у тебя есть пос
